[package]
name = "alexia"
version = "0.10.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Alexia — an assistant that runs on your own machine."

# Deliberately outside the pnpm workspace. Everything Alexia does is on the other side of an
# HTTP port; this crate starts that and draws a window round it.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` because the overlay is an NSPanel on a Mac (D145), and the panel crate needs
# it; it compiles to nothing anywhere else.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# `generate_context!` expands to code that names `serde_json` in this crate's root, so it has
# to be a direct dependency even though nothing here mentions it.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The four things Rust is here for, and one plugin each. If a fifth appears, ask what it is
# doing that core could not do behind the port.
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# Spawning the core sidecar, and nothing else. No shell, no arbitrary commands: the
# capability file allows exactly one binary by name.
tauri-plugin-shell = "2"
# The fifth, and the answer to the question above (D153): the keychain trusts a program, not a
# script, so core — a program that runs any script — cannot be the one it trusts. `v1`, the
# default, is the native store on each platform and an error anywhere else, never a mock.
keyring = "4.2"
# The vault's token. Already in the tree under Tauri; named here because it is used here.
getrandom = "0.3"
# The sixth, and not a thing Rust decides (`temps.rs`): the temperature sensors on a Mac and on
# Windows, which core could reach only through a native addon. Components only — no process,
# disk or network walking compiled in. 0.37 because it shares Tauri's `windows` 0.61 rather than
# bring a second copy of it into the Windows build.
sysinfo = { version = "0.37", default-features = false, features = ["component"] }

# Not a fifth thing: the hotkey's overlay, on a Mac (D145). macOS shows an ordinary window over
# another app's full-screen Space only if it does not activate its app, and the one window that
# does not is a non-activating NSPanel. Swapping a window's AppKit class is unsafe code nobody
# here should own, so it is this crate's — used by Cap, Screenpipe and others for exactly this —
# pinned to a commit, because it is published from git rather than crates.io.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
# The genie's picture of the sheet (`snapshot.rs`): WKWebView's own `takeSnapshot`, which a page
# cannot reach. Not new code in the tree — Tauri's web view (wry) is built on these same crates at
# these same versions, so this names features of what is already compiled in rather than adding.
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSValue", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[profile.release]
# A smaller installer is a shorter download in front of somebody who has not yet seen the
# product work. `panic = "abort"` also means a crash is a crash rather than an unwind through
# a webview.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
