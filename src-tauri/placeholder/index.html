<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Alexia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 24px;
        box-sizing: border-box;
        font: 15px/1.5 -apple-system, system-ui, 'Segoe UI', sans-serif;
        text-align: center;
        color: #555;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #aaa;
          background: #1c1c1e;
        }
      }
      button {
        font: inherit;
        margin-top: 12px;
      }
    </style>
  </head>
  <!-- The starting page: what both windows show until core is listening, and `main.rs` sends
       them to it. Pointed at core straight away, a window whose page asked before core was up
       stayed white for good. Nothing here talks to core; `main.rs` decides when to leave.

       It is called `placeholder` and not `ui` for a reason that cost an afternoon: core finds
       the shell by walking up from wherever it is running and taking the first `ui` folder
       with an `index.html` in it, and from inside the bundle that walk reaches `src-tauri/ui`
       before it reaches the real one. The page came up saying this, which was true and
       useless. Two names that cannot collide is cheaper than a rule about which wins. -->
  <body>
    <main>
      <p id="starting">Starting Alexia…</p>
      <div id="late" hidden>
        <p>Alexia is taking longer than usual to start. She keeps trying, and this window will open as soon as she is ready.</p>
        <button id="again" type="button">Try again</button>
      </div>
    </main>
    <script>
      // Fifteen seconds is well past a slow cold start. After that the person is told, and given
      // the one thing that can help: *Try again* stops the core that has not answered, and the
      // shell starts a fresh one.
      const starting = document.getElementById('starting')
      const late = document.getElementById('late')
      let timer
      const wait = () => {
        starting.hidden = false
        late.hidden = true
        clearTimeout(timer)
        timer = setTimeout(() => {
          starting.hidden = true
          late.hidden = false
        }, 15000)
      }
      document.getElementById('again').addEventListener('click', () => {
        void window.__TAURI__?.event.emit('start-core-again')
        wait()
      })
      wait()
    </script>
  </body>
</html>
