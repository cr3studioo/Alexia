[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.87"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }   # TR-09: SQLCipher
keyring = "4.2"          # same family as connect/
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
regex = "1"                # core's redaction patterns
sha2 = "0.10"              # core's download digests
zip = { version = "2", default-features = false, features = ["deflate"] }   # llama.cpp's Windows release
chrono = { version = "0.4", default-features = false, features = ["clock"] }   # local wall-clock time: schedules, `today`

[workspace.lints.rust]
unsafe_code = "deny"     # alexia-mcp's Job Object code opts out with a module-level allow

[profile.release]
# SP-12: one small binary. Same choices as connect/, minus panic=abort (a panicking task must
# not take the supervisor down with it).
opt-level = "s"
lto = true
codegen-units = 1
strip = true
