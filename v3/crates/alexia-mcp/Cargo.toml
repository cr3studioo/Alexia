[package]
name = "alexia-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alexia-store = { path = "../alexia-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# SP-10 runs plugins in-process as wasm; there is no std answer. Compiler and async only,
# to keep the single binary (SP-12) small.
wasmtime = { version = "34.0.2", default-features = false, features = ["cranelift", "async"] }
wasmtime-wasi = { version = "34.0.2", default-features = false, features = ["preview1"] }

# Job Objects have no std or tokio API, and without one a plugin's own children outlive it on
# Windows (INTERFACES.md §3.2).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
