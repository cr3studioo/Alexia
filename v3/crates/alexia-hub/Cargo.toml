[package]
name = "alexia-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alexia-store = { path = "../alexia-store" }
alexia-mcp = { path = "../alexia-mcp" }
alexia-core = { path = "../alexia-core" }
alexia-gateway = { path = "../alexia-gateway" }
alexia-scheduler = { path = "../alexia-scheduler" }
alexia-api = { path = "../alexia-api" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rpassword = "7"
async-trait = { workspace = true }
# local::Runtime needs a client (P2-38).
reqwest = { workspace = true }
# The binary needs somewhere to print `tracing` events; `fmt` only, the same crate connect/ uses.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
# agent_e2e.rs writes a local wall-clock time for a scheduled job (P2-39).
chrono = { workspace = true }
# tests/cli.rs builds a v2 database file.
rusqlite = { workspace = true }

[features]
# Runs tests/v2_plugins.rs. Needs Node and a built v2 checkout; never on in `cargo test --workspace`.
v2-conformance = []
# Runs tests/pc_actions.rs: drives this PC's desktop (Notepad, the mouse, Explorer) through the
# window API. Run it by hand from the owner's desktop session; never on in `cargo test --workspace`.
pc-actions = []

[[test]]
name = "v2_plugins"
required-features = ["v2-conformance"]

[[test]]
name = "pc_actions"
required-features = ["pc-actions"]
