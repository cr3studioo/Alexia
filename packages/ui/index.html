<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexia</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <span class="name">Alexia</span>
      <!-- Which model answered, and what the month has cost. Both always on screen: the
           first is how you know where your words went, the second is how nobody is ever
           surprised by a bill. -->
      <span id="model" class="badge">no model yet</span>
      <span id="spend" class="badge">$0.00</span>
    </header>

    <!-- First run: steps 2, 3 and 4a. No account, no tour, no permission questions — the
         first thing anybody is asked is what to call it, and the second is where their
         words are allowed to go. -->
    <section id="setup" hidden>
      <label class="field">
        <span>What should I call me?</span>
        <input id="name" value="Alexia" />
      </label>

      <h2>How should I run?</h2>
      <div class="cards">
        <label class="card">
          <input type="radio" name="mode" value="local" />
          <b>Local</b>
          <span
            >Everything on this machine — text, speech, images. The best privacy there is,
            and it needs a capable machine and a download of a few gigabytes.</span
          >
        </label>
        <label class="card">
          <input type="radio" name="mode" value="combined" checked />
          <b>Combined <em>recommended</em></b>
          <span
            >The cloud does the thinking; your machine makes the images and the speech. Each
            job goes to the side that is better at it, and it needs no download.</span
          >
          <small id="training"></small>
        </label>
        <label class="card">
          <input type="radio" name="mode" value="cloud" />
          <b>Cloud</b>
          <span>Everything through APIs. For a machine that would rather not do the work.</span>
        </label>
      </div>

      <div id="connect">
        <h2>Connect a provider</h2>
        <p class="quiet">OpenRouter's free tier needs no card. You can also do this later.</p>
        <label class="field">
          <select id="provider"></select>
          <input id="key" type="password" placeholder="Paste a key" autocomplete="off" />
        </label>
        <p class="quiet" id="terms"></p>
      </div>

      <button id="begin" type="button">Start</button>
    </section>

    <main id="log" aria-live="polite"></main>
    <p id="note" hidden></p>

    <form id="ask">
      <textarea id="text" rows="1" placeholder="Ask Alexia" autofocus></textarea>
      <button type="submit">Send</button>
    </form>

    <script type="module" src="/main.js" data-token="__TOKEN__"></script>
  </body>
</html>
