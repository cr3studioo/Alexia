<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexia</title>
    <link rel="icon" href="/alexia.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <!-- Two views, one at a time. `data-view` is the switch, which is what makes "first run and
       the composer are never on screen together" structural: on the first-run view the
       composer is not rendered at all, rather than hidden and hoping. -->
  <body data-view="chat">
    <!-- Identity, then controls, then status, then the number that matters. Four different
         kinds of thing, and they used to be four identical pills — which made a dropdown you
         can change look like a figure you cannot. -->
    <header>
      <img class="mark" src="/alexia.png" alt="" width="256" height="256" />
      <span class="name">Alexia</span>

      <!-- The UI equivalent of /local, /cloud and /combined. Every command has one: the
           commands are a shortcut for people who like them, never the only route. -->
      <select id="mode" class="control mode" title="Where the work happens" aria-label="Where the work happens">
        <option value="local">Local</option>
        <option value="combined">Combined</option>
        <option value="cloud">Cloud</option>
      </select>

      <!-- What Alexia may do unasked. A control, not only a settings page: this is the number
           one thing a person changes after being surprised once. -->
      <select
        id="permission"
        class="control"
        title="What Alexia may do without asking"
        aria-label="What Alexia may do without asking"
      ></select>

      <!-- Every plugin's settings, rendered by core from the manifest. A control, because
           there is no command for it: a screen you cannot find is a screen that does not
           exist. -->
      <button id="open-settings" class="control" type="button" title="What was asked at first run, plugins, and the skills installed">
        Settings
      </button>

      <!-- The control surface (M6-2). The questions that arrive on day thirty: what has this
           been doing, what did I say yes to, what does it know. Records you read, which is a
           different screen from values you change. -->
      <button id="open-control" class="control" type="button" title="What Alexia has been doing, and what it knows">
        Control
      </button>

      <!-- Which model answered, and what the month has cost. Both always on screen: the first
           is how you know where your words went, the second is how nobody is ever surprised
           by a bill. -->
      <span id="model" class="status">no model yet</span>
      <p class="money">
        <span class="money-label">this month</span>
        <span id="spend" class="money-value">$0.00</span>
      </p>
    </header>

    <!-- First run: steps 2, 3 and 4a. No account, no tour, no permission questions — the
         first thing anybody is asked is what to call it, and the second is where their words
         are allowed to go. -->
    <section id="first-run" class="view">
      <div class="centred">
        <img class="opening" src="/alexia.png" alt="" width="256" height="256" />

        <!-- Alexia.md's words, exactly: step 2 is "What should I call you?", prefilled and
             skippable. It is the first sentence anybody reads, and the shell had it as "What
             should I call me?" — which is not the spec's line and not a sentence. -->
        <div class="group">
          <label class="field">
            <span class="label ask-big">What should I call you?</span>
            <input id="name" class="short" value="Alexia" />
          </label>
        </div>

        <div class="group">
          <h2 class="step-heading">How should I run?</h2>
          <div class="cards">
            <label class="card">
              <span class="card-head">
                <input type="radio" name="mode" value="local" />
                <b>Local</b>
              </span>
              <span
                >Everything on this machine — text, speech, images. The best privacy there is,
                and it needs a capable machine and a download of a few gigabytes.</span
              >
            </label>
            <label class="card">
              <span class="card-head">
                <input type="radio" name="mode" value="combined" checked />
                <b>Combined <em>recommended</em></b>
              </span>
              <span
                >The cloud does the thinking; your machine makes the images and the speech.
                Each job goes to the side that is better at it, and it needs no download.</span
              >
              <small id="training"></small>
            </label>
            <label class="card">
              <span class="card-head">
                <input type="radio" name="mode" value="cloud" />
                <b>Cloud</b>
              </span>
              <span>Everything through APIs. For a machine that would rather not do the work.</span>
            </label>
          </div>
        </div>

        <div class="group" id="connect">
          <h2 class="step-heading">Connect a provider</h2>
          <p class="hint">OpenRouter's free tier needs no card. You can also do this later.</p>
          <div class="pair">
            <select id="provider" aria-label="Provider"></select>
            <input id="key" type="password" placeholder="Paste a key" autocomplete="off" aria-label="API key" />
          </div>
          <p class="hint" id="terms"></p>
        </div>

        <!-- Step 5 lives here rather than as a screen of its own: Alexia is a tray-resident
             daemon, so *it will be in the tray and this is how you summon it* is the one
             thing a person has to be told once, and the only setting that goes with it. Both
             are hidden entirely in a browser, where neither means anything. -->
        <div class="group" id="desktop" hidden>
          <h2 class="step-heading">One last thing</h2>
          <p class="hint" id="hotkey-line"></p>
          <label class="switch">
            <input id="autostart" type="checkbox" checked />
            <span class="track"></span>
            <span>Start Alexia when I sign in</span>
          </label>
        </div>

        <button id="begin" class="begin" type="button">Start</button>
      </div>
    </section>

    <!-- The settings screen (M2-1). Ten widgets, declared in manifests, drawn here — and
         drawn while every plugin is stopped, which with lazy spawn is the ordinary case.
         Above them, the answers first run took: a screen you saw once, for thirty seconds,
         should not be the only place its questions can be answered. -->
    <section id="settings" class="view">
      <div class="centred">
        <div class="view-top">
          <h2 class="step-heading">Settings</h2>
          <button id="close-settings" class="quiet-button" type="button">Back</button>
        </div>

        <!-- The three questions first run asked, in the same order and the same words, with
             their answers in them. First run is the only place they were editable, which
             made every one of them a decision taken once by somebody who had used Alexia for
             thirty seconds. Written by the same `/api/setup` the Start button writes. -->
        <div class="group" id="setup-settings">
          <label class="field">
            <span class="label">What should I call you?</span>
            <input id="name-setting" class="short" />
          </label>
          <label class="field">
            <span class="label">How should I run?</span>
            <!-- The header's picker and this one are the same control twice, and both go
                 through `/local`, `/combined`, `/cloud` — so there is one writer and neither
                 can show a mode the other has changed. -->
            <select id="mode-setting" class="mode">
              <option value="local">Local — everything on this machine</option>
              <option value="combined">Combined — cloud thinks, this machine makes</option>
              <option value="cloud">Cloud — everything through APIs</option>
            </select>
          </label>
          <div class="field">
            <span class="label">Connect a provider</span>
            <div class="pair">
              <select id="provider-setting" aria-label="Provider"></select>
              <input
                id="key-setting"
                type="password"
                placeholder="Paste a key"
                autocomplete="off"
                aria-label="API key"
              />
              <button id="save-key" class="quiet-button" type="button">Save</button>
            </div>
            <!-- Whether there is a key for the chosen provider, never the key itself: it went
                 to the keychain and nothing here can read it back. -->
            <p class="hint" id="key-said"></p>
          </div>
        </div>
        <!-- The obvious way to turn autostart off, which is the half of "starts on login"
             that people actually need. Hidden in a browser, where it is not a real setting. -->
        <div class="field group" id="desktop-settings" hidden>
          <label class="switch">
            <input id="autostart-setting" type="checkbox" />
            <span class="track"></span>
            <span>Start Alexia when I sign in</span>
          </label>
          <p class="hint" id="hotkey-setting"></p>
        </div>
        <!-- The library (M3-2). Browsing is the route a person should reach for; the
             path box further down is the one that still works when there is no registry,
             and the MCP form is the ten thousand servers Alexia inherits (M3-6). -->
        <div id="library"></div>
        <h3 class="step-heading">Plugins</h3>
        <div id="panes"></div>
        <div id="problems"></div>
        <!-- Know-how, as opposed to capability (M2-2). A skill is a folder with a Markdown
             file in it, so there is nothing to configure — only what is there and what is
             broken. Installing one is the skills marketplace, at M3-5. -->
        <div id="skills"></div>
      </div>
    </section>

    <!-- The control surface (M6-2). Nothing in this markup names a tab: the strip is built
         from what core sends, which is core's own tabs plus one for every enabled plugin
         that declared a panel. Delete the plugin's folder and its tab goes with it. -->
    <section id="control" class="view">
      <div class="centred">
        <div class="view-top">
          <h2 class="step-heading">Control</h2>
          <button id="close-control" class="quiet-button" type="button">Back</button>
        </div>

        <!-- Narrow: the strip collapses to the active tab's own name, and tapping it opens
             the list. Nine tabs in a scrollable row is technically fine and awkward in
             practice, and the overlay is narrower than any phone this was tested on. -->
        <button id="tab-current" class="tab-current" type="button" aria-expanded="false" hidden></button>
        <nav id="tabs" class="tabs" aria-label="Control panels"></nav>

        <div id="panel"></div>
      </div>
    </section>

    <div id="chat" class="view">
      <main id="log" aria-live="polite"></main>

      <!-- The permission prompt. It sits above the composer rather than over the page: a
           modal here would cover the trace, which is the thing being decided about. -->
      <div id="prompt" hidden>
        <p id="prompt-why"></p>
        <div class="row">
          <button id="allow" type="button">Allow once</button>
          <button id="deny" type="button" class="quiet-button">Not this time</button>
        </div>
      </div>

      <p id="note" hidden></p>

      <!-- Typing `/` lists what there is, with a line each. Nobody is going to read
           documentation to find a command. -->
      <ul id="menu" hidden></ul>

      <form id="ask">
        <textarea id="text" rows="1" placeholder="Ask Alexia" autofocus></textarea>
        <button type="submit">Send</button>
        <!-- Not a cancel that takes effect at the end of the step. It works while a tool call
             is in flight, which is the only kind worth having. -->
        <button id="stop" type="button" class="quiet-button" hidden>Stop</button>
      </form>
    </div>

    <!-- The command palette (M6-10). Ctrl+K from anywhere. It finds a thing and opens the
         tab it lives on with the word already typed into that panel's filter — it never runs
         anything, because slash commands already do that and two command systems with two
         permission stories is one too many. -->
    <div id="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Find">
        <input id="palette-input" type="search" placeholder="Find a run, a skill, a tool, a panel…" autocomplete="off" />
        <ul id="palette-hits"></ul>
      </div>
    </div>

    <script type="module" src="/main.js" data-token="__TOKEN__"></script>
  </body>
</html>
