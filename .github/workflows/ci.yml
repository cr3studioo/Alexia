name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows first: it is the target. Ubuntu alongside, so a portability
        # break shows up the day it happens rather than at M5.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Invariant 2: core works with zero plugins installed. A job, not an aspiration — the
  # moment core needs a plugin to start, "delete the folder" becomes "delete the folder and
  # hope". The tests that use the repo's own plugins as fixtures step aside with them; see
  # `needPlugins` in vitest.config.ts. `pnpm check:no-plugins` is the same thing locally, and
  # exists because this job was red for two milestones with nothing on a laptop able to say so.
  no-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mv plugins "$RUNNER_TEMP/plugins"
      - run: pnpm check
