# SPDX-License-Identifier: AGPL-3.0-only
#
# The signed installer, and the update that reaches people who already have one (M5-3, D119).
#
# `[GATE]`. **This workflow does not run on a push**, and what it produces is a *draft*
# release: applying to a certificate programme and publishing a binary with somebody's name on
# it are outward-facing acts, so a person starts this and a person presses publish.
#
# **Two switches, because they answer different questions.** `sign_windows` is Authenticode, and it
# decides whether Windows warns the person double-clicking the installer. `publish` is the
# release, and it decides whether an Alexia already on somebody's machine can update — that
# one needs only the minisign key, which costs nothing and exists today. Holding the second
# hostage to the first is how an update path stays untested until the day it matters, so an
# unsigned release is a real release: SmartScreen complains, and updates work.
#
# The three things worth knowing before pressing it:
#
# * The publisher will read **SignPath Foundation**, not Alexia. That is what a free
#   certificate for an open-source project looks like, and it belongs in the release notes
#   rather than in a support email three days later.
# * An OV certificate meets SmartScreen only once reputation accumulates. Until then some
#   people will see a warning — and **a SmartScreen warning in front of a non-technical user
#   is precisely where setup dies**, which is the whole reason M5-6 exists.
# * **The update signature is taken after SignPath, never before.** Authenticode signing
#   rewrites the installer, so a minisign signature made at build time describes bytes that
#   no longer exist and every update would be refused on every machine with the one error
#   nobody can act on. The order below is build → Authenticode → minisign → `latest.json`,
#   and it is the only order that works.
#
# `TAURI_SIGNING_PRIVATE_KEY` is the minisign key generated by `tauri signer generate`. It is
# not the code-signing certificate and has nothing to do with SignPath: it is what proves to
# an Alexia already on somebody's machine that an update came from this repository. Losing it
# means every existing install stops accepting updates, so it lives in one secret and one
# password manager and nowhere else.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, e.g. 0.2.0 — must match APP_VERSION
        required: true
      # One switch per platform (D150), because the two certificates arrive separately — SignPath
      # is an application to a programme and Apple is a paid account — and a single switch meant
      # the first one to exist could not be used until the second did.
      sign_windows:
        description: Submit the Windows installer to SignPath for Authenticode signing. Off until the certificate exists.
        type: boolean
        default: false
      # Three answers rather than on/off (D207): what a Mac release is signed with decides whether
      # somebody's Accessibility grant survives the update, and ad hoc is the one answer where it
      # never does. So the default is the certificate that keeps it, and `ad-hoc` has to be chosen.
      sign_macos:
        description: >-
          How to sign the Mac app. self-signed keeps Accessibility across updates (run
          scripts/macos-signing-cert.mjs once first); developer-id also notarises and needs the
          Apple account; ad-hoc makes every Mac re-grant Accessibility after this update.
        type: choice
        options: [self-signed, developer-id, ad-hoc]
        default: self-signed
      publish:
        description: Draft a GitHub Release. This is what existing installs update from.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile
      # Green before signed. A release is the one build nobody gets to fix afterwards — and
      # `12-version-in-step` is in here, so a version typed into the box above that disagrees
      # with the one compiled into the app fails now rather than in an updater six weeks on.
      - run: pnpm check

      - name: The version in the tree is the version being released
        shell: bash
        run: |
          built=$(node -e "import('./packages/protocol/dist/src/version.js').then(m=>console.log(m.APP_VERSION))")
          if [ "$built" != "${{ inputs.version }}" ]; then
            echo "This tree builds Alexia $built, and you asked for ${{ inputs.version }}."
            echo "Bump APP_VERSION in packages/protocol/src/version.ts (pnpm invariants names the rest)."
            exit 1
          fi

      # Both sidecars and core's resources: Node comes from the same packaging script the
      # crude installer uses, and the native transport is built with Cargo beside it.
      - run: node scripts/sidecar.mjs
      - run: pnpm tauri build

      - uses: actions/upload-artifact@v5
        id: upload
        with:
          name: alexia-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe

      # SignPath signs an artifact this workflow already produced; it never sees the source
      # and never holds a key this repository could leak. Skipped entirely until the
      # certificate exists — and **skipping it does not stop a release**, which is the whole
      # point of it being a separate switch. Authenticode decides whether Windows warns about
      # the installer; minisign below decides whether an Alexia already on somebody's machine
      # will accept it. They are different keys answering different questions, and holding the
      # second hostage to the first is how an update path stays untested until the day it
      # matters.
      - name: Sign
        if: inputs.sign_windows
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: alexia
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # One folder holding the bytes that will actually be published, whichever route they
      # came by. Everything downstream reads `out/` and nothing downstream asks which.
      - name: Collect the installer
        if: inputs.publish
        shell: bash
        run: |
          mkdir -p out
          if [ -d signed ]; then cp signed/*.exe out/; else cp src-tauri/target/release/bundle/nsis/*.exe out/; fi
          ls -l out

      # The update signature, over the bytes that will actually be downloaded. See the header:
      # taken *after* SignPath because Authenticode rewrites the installer. `latest.json` is
      # written by `publish` below from every platform's `.sig`, because one file lists them all.
      - name: Sign the update
        if: inputs.publish
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set, so this release could be published and"
            echo "then refused by every Alexia that tried to update to it — the failure would"
            echo "surface weeks later, on somebody else's machine, as a signature error."
            echo ""
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY --repo $GITHUB_REPOSITORY < ~/.alexia/updater.key"
            exit 1
          fi
          pnpm tauri signer sign "$(ls out/*.exe | head -1)"

      - uses: actions/upload-artifact@v5
        if: inputs.publish
        with:
          name: release-windows-x86_64
          path: out/

  # The Mac app (D145). Same gate, same order — and the two switches mean the same thing here as
  # above: `sign_macos` decides whether macOS warns the person opening it, `publish` decides
  # whether an Alexia already installed can update.
  #
  # **One universal app, not one per processor** (D150). Two disk images asked the person
  # downloading which chip their Mac has, before they had seen anything work. So one Apple
  # Silicon runner builds both halves: Tauri merges the shell, and `sidecar.mjs --universal`
  # merges Node, the native transport and the keychain library. About twice the download,
  # and one question fewer.
  #
  # **`sign_macos` answers two questions, and only `developer-id` answers both** (D207).
  #
  # * *Does macOS open it?* Only with a Developer ID and notarisation. Anything else is not
  #   warned about so much as refused: a downloaded app opens only after System Settings →
  #   Privacy & Security → *Open Anyway*. That is a cold-install test failing on its first
  #   screen, so such a release says so in its notes rather than in a support email.
  # * *Does an update keep what the person granted?* Accessibility (and the keychain's *always
  #   allow*) is kept against the app's designated requirement. Signed ad hoc, that requirement
  #   is the binary's own hash, so every release is a stranger and computer control stops until
  #   Alexia is switched off and on again in Accessibility. Signed with a certificate it is
  #   `identifier "dev.alexia.app" and certificate leaf = H"…"`, which the next release meets too.
  #
  # So `self-signed` — a certificate made once by `scripts/macos-signing-cert.mjs`, free — answers
  # the second and not the first, and cannot be notarised. It is the default because the one
  # thing worse than a re-grant is a re-grant on every release. **The certificate is part of
  # every installed Alexia's grant**: regenerated or lost, every Mac re-grants once. Moving to
  # `developer-id` later changes the requirement too, so that costs everybody one re-grant more.
  #
  # `developer-id` reads `APPLE_CERTIFICATE` (the Developer ID Application certificate as base64
  # .p12) and `APPLE_CERTIFICATE_PASSWORD`, `APPLE_SIGNING_IDENTITY` (its name, "Developer ID
  # Application: …"), and `APPLE_ID`, `APPLE_PASSWORD` (an app-specific password) and
  # `APPLE_TEAM_ID` for notarisation. `self-signed` reads `MACOS_SELF_SIGNED_CERTIFICATE` and
  # `MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD`, and the variable `MACOS_SELF_SIGNED_IDENTITY` — the
  # certificate's SHA-1, which is what it signs with, so a different certificate in the secret
  # fails here rather than shipping. Separate secrets on purpose: the Developer ID arriving must
  # not overwrite the one certificate nobody may lose. Tauri notarises and staples only when the
  # notary three are present, and signs ad hoc when no identity is — which is what
  # `tauri.macos.conf.json` falls back to, so an unsigned build still runs under the hardened
  # runtime it would ship with.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: The version in the tree is the version being released
        run: |
          built=$(node -e "import('./packages/protocol/dist/src/version.js').then(m=>console.log(m.APP_VERSION))")
          if [ "$built" != "${{ inputs.version }}" ]; then
            echo "This tree builds Alexia $built, and you asked for ${{ inputs.version }}."
            exit 1
          fi

      # Before anything is built, because the import below fails on an empty secret with a
      # message about a file, and a build signed with nothing would be the ad-hoc release nobody
      # chose.
      - name: The certificate for this signature is here
        if: inputs.sign_macos != 'ad-hoc'
        env:
          MODE: ${{ inputs.sign_macos }}
          DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          SELF_SIGNED: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE != '' && secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD != '' && vars.MACOS_SELF_SIGNED_IDENTITY != '' }}
        run: |
          if [ "$MODE" = "developer-id" ] && [ "$DEVELOPER_ID" != "true" ]; then
            echo "sign_macos is developer-id, and APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD or"
            echo "APPLE_SIGNING_IDENTITY is not set. They arrive with the Apple Developer account."
            exit 1
          fi
          if [ "$MODE" = "self-signed" ] && [ "$SELF_SIGNED" != "true" ]; then
            echo "sign_macos is self-signed, and MACOS_SELF_SIGNED_CERTIFICATE,"
            echo "MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD or the variable MACOS_SELF_SIGNED_IDENTITY"
            echo "is not set. On the owner's Mac, once:"
            echo ""
            echo "  node scripts/macos-signing-cert.mjs"
            echo ""
            echo "prints the three commands. Choosing ad-hoc instead releases, and every Mac that"
            echo "updates to it has to grant Accessibility again."
            exit 1
          fi

      # Into a keychain of the runner's own, before anything signs: `sidecar.mjs` signs the
      # keychain library in `resources/` with this identity, and `tauri build` signs the rest.
      # The action also sets the key's partition list, without which `codesign` would stop at a
      # keychain dialog nobody on a runner can answer. A self-signed certificate is not trusted
      # by the runner, and does not need to be: `codesign` signs with it all the same, and what
      # macOS keeps a grant against is its hash, not its trust.
      - name: Import the signing certificate
        if: inputs.sign_macos != 'ad-hoc'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ inputs.sign_macos == 'developer-id' && secrets.APPLE_CERTIFICATE || secrets.MACOS_SELF_SIGNED_CERTIFICATE }}
          p12-password: ${{ inputs.sign_macos == 'developer-id' && secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}

      # The variables are set only when signing, never set empty: Tauri reads an empty
      # `APPLE_SIGNING_IDENTITY` as an identity called "", which is not ad hoc — it is a failure.
      # Self-signed sets the identity and nothing else, so Tauri skips notarisation, which Apple
      # would refuse for a certificate it did not issue.
      - name: Build, sign and notarise
        env:
          MODE: ${{ inputs.sign_macos }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SELF_SIGNED_IDENTITY: ${{ vars.MACOS_SELF_SIGNED_IDENTITY }}
        run: |
          case "$MODE" in
            developer-id)
              export APPLE_SIGNING_IDENTITY="$IDENTITY" APPLE_ID="$NOTARY_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM" ;;
            self-signed)
              export APPLE_SIGNING_IDENTITY="$SELF_SIGNED_IDENTITY" ;;
          esac
          node scripts/sidecar.mjs --universal
          pnpm tauri build --target universal-apple-darwin

      # What a grant is kept against, checked on the code that will ship rather than assumed from
      # the flags: the whole bundle verifies, and the shell, the core and the keychain library
      # each carry a requirement that names a certificate, not a hash of themselves. A nested
      # piece signed differently from the rest is how an app launches fine and is then refused
      # by the one permission it needed. Printed, so two releases' logs can be compared.
      - name: The signature survives an update
        if: inputs.sign_macos != 'ad-hoc'
        env:
          MODE: ${{ inputs.sign_macos }}
          SELF_SIGNED_IDENTITY: ${{ vars.MACOS_SELF_SIGNED_IDENTITY }}
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Alexia.app
          codesign --verify --deep --strict --verbose=2 "$app"
          leaf=$(printf '%s' "$SELF_SIGNED_IDENTITY" | tr 'A-F' 'a-f')
          for code in "$app" "$app"/Contents/MacOS/* "$app"/Contents/Resources/resources/keyring.darwin-universal.node; do
            requirement=$(codesign -d -r- "$code" 2>/dev/null)
            echo "$(basename "$code"): $requirement"
            case "$requirement" in
              *cdhash*|"") echo "$code is signed ad hoc, so macOS would forget its grants on the next update."; exit 1 ;;
            esac
            if [ "$MODE" = "self-signed" ]; then
              case "$requirement" in
                *"certificate leaf = H\"$leaf\""*) ;;
                *) echo "$code is not signed with the certificate MACOS_SELF_SIGNED_IDENTITY names."; exit 1 ;;
              esac
            fi
          done

      # Both halves really are in there. A universal build that quietly came out single-processor
      # would install fine on the machine that built it and refuse to open on the other kind.
      - name: The app runs on both processors
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Alexia.app
          for sidecar in alexia-core alexia-connect; do
            test -x "$app/Contents/MacOS/$sidecar" || { echo "$sidecar is missing from the app"; exit 1; }
          done
          for binary in "$app"/Contents/MacOS/* "$app"/Contents/Resources/resources/keyring.darwin-universal.node; do
            archs=$(lipo -archs "$binary")
            echo "$(basename "$binary"): $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "$binary is not universal"; exit 1 ;; esac
          done

      # The disk image for somebody installing, and the app itself compressed for somebody
      # updating — Tauri's updater replaces a Mac app from a `.app.tar.gz`, not from a dmg.
      - name: Collect the app
        if: inputs.publish
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          tar -czf out/Alexia_darwin-universal.app.tar.gz -C "$bundle"/macos Alexia.app
          ls -l out

      # After notarisation, never before, for the reason the Windows job signs after SignPath:
      # stapling writes the ticket into the app, so a signature over the earlier bytes would be
      # a signature over an app nobody downloads.
      - name: Sign the update
        if: inputs.publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; see the Windows job for why that stops a release."
            exit 1
          fi
          pnpm tauri signer sign out/Alexia_darwin-universal.app.tar.gz

      - uses: actions/upload-artifact@v5
        if: inputs.publish
        with:
          name: release-darwin-universal
          path: out/

  # The Intel half, run on an Intel Mac before anybody can download it (D150). The build above
  # happens on Apple Silicon, where the x86_64 half is compiled and merged but never executed —
  # so the first machine to run it would otherwise be a person's. The core starts from inside
  # the very app that will be published, serves the shell, and loads the merged keychain
  # library, all as x86_64.
  macos-intel:
    needs: macos
    if: inputs.publish
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-darwin-universal
          path: out
      - name: The published app's core runs on Intel
        run: |
          tar -xzf out/Alexia_darwin-universal.app.tar.gz
          core=Alexia.app/Contents/MacOS/alexia-core
          cd Alexia.app/Contents/Resources/resources
          home=$(mktemp -d)
          # This step plays the shell (D153): under ALEXIA_TAURI the core starts only once it is
          # handed a vault on stdin. A stand-in that answers *nothing stored*, which is the truth
          # about a fresh install, run by the same core so this job still needs nothing installed —
          # except the one entry, which says there is nothing older to move (D187), so the core
          # never reaches into this runner's own keychain looking for any.
          "$GITHUB_WORKSPACE/$core" -e 'const s=require("net").createServer(c=>c.once("data",d=>{const a=JSON.parse(String(d));c.end(JSON.stringify({ok:true,secret:a.account==="_core.vault"?JSON.stringify({secrets:{},looked:[],moved:"all"}):null})+"\n")})).listen(0,"127.0.0.1",()=>console.log(JSON.stringify({port:s.address().port,token:"release-check"})))' > "$home/vault.line" &
          vault=$!
          for _ in $(seq 1 50); do [ -s "$home/vault.line" ] && break; sleep 0.2; done
          HOME="$home" ALEXIA_TAURI=1 "$GITHUB_WORKSPACE/$core" --disable-sigusr1 boot.mjs < "$home/vault.line" > "$home/said.log" 2>&1 &
          pid=$!
          url=""
          for _ in $(seq 1 150); do
            url=$(grep -oE 'http://127\.0\.0\.1:[0-9]+' "$home/said.log" | head -1 || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          if [ -z "$url" ]; then cat "$home/said.log"; kill $pid $vault; exit 1; fi
          token=$(curl -s "$url" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          curl -sf -H "x-alexia-token: $token" "$url/api/plugins" | grep -q '"panes"'
          kill $pid $vault
          "$GITHUB_WORKSPACE/$core" -e "require('./keyring.darwin-universal.node'); if (process.arch !== 'x64') process.exit(1); console.log('core and keychain run as', process.arch)"

  # One release and one `latest.json` for every platform. Written here rather than in a platform
  # job because the file is a single list: two jobs each writing their own would publish
  # whichever finished last, and every other platform's installs would stop updating.
  publish:
    needs: [windows, macos, macos-intel]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Write latest.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          // Tauri's static endpoint format, and only the fields it reads.
          //
          // **The URL names this release's tag, never `latest`** (D151). The app reads this file
          // at startup and downloads only when somebody presses the button — which in a tray app
          // can be hours later. With `releases/latest/download/<name>` the address moved the
          // moment the next release went out, so an offer made before it pointed at a file the
          // new release did not have: 0.5.0's `Alexia_darwin-aarch64.app.tar.gz` answered 404
          // once 0.5.1 was latest. Same name would have been worse, not better — the new bytes
          // under the old signature, refused as tampered. Pinned, a stale offer installs exactly
          // what it offered, and the next start offers the rest.
          const files = readdirSync('out')
          const entry = (file) => ({
            signature: readFileSync(join('out', `${file}.sig`), 'utf8').trim(),
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${process.env.VERSION}/${file}`,
          })
          const platforms = {}
          const exe = files.find((f) => f.endsWith('.exe'))
          if (exe) platforms['windows-x86_64'] = entry(exe)
          // One universal app under both names. The updater compiled into each half of it asks
          // for its own processor — `darwin-aarch64` or `darwin-x86_64` — and never for
          // `darwin-universal`, so both keys point at the same file.
          const app = 'Alexia_darwin-universal.app.tar.gz'
          if (files.includes(app)) {
            for (const platform of ['darwin-aarch64', 'darwin-x86_64']) platforms[platform] = entry(app)
          }
          writeFileSync(
            'out/latest.json',
            JSON.stringify({ version: process.env.VERSION, pub_date: new Date().toISOString(), platforms }, null, 2),
          )
          console.log(Object.keys(platforms).join(', '))
          NODE

      # `[GATE]` again, and deliberately the last one: publishing is the outward-facing act.
      # A draft, so a person presses the button that makes it public.
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          # The app's release is the latest release. Plugin releases are cut with
          # `--latest=false` for exactly this reason: the updater reads
          # `releases/latest/download/latest.json`, and a plugin release claiming to be latest
          # would point every install at a release with no installer on it.
          make_latest: true
          files: |
            out/*.exe
            out/*.dmg
            out/*.app.tar.gz
            out/latest.json
          body: |
            Alexia ${{ inputs.version }}.

            **Windows:** ${{ inputs.sign_windows && 'the publisher on the installer reads "SignPath Foundation". That is the certificate programme that signs open-source releases for free, and it is not a sign that something is wrong. Windows may still show a SmartScreen warning until this build accumulates reputation.' || 'the installer is not code-signed yet, so SmartScreen will warn: More info, then Run anyway.' }}

            **macOS:** one disk image for every Mac, Apple Silicon and Intel alike. ${{ inputs.sign_macos == 'developer-id' && 'The app is signed with a Developer ID and notarised by Apple.' || inputs.sign_macos == 'self-signed' && 'The app is signed with Alexia''s own certificate rather than one from Apple, so macOS still refuses to open it the first time: press Done, open System Settings, then Privacy & Security, and press Open Anyway beside Alexia. The certificate is what lets permissions you give Alexia, such as Accessibility, carry over to future updates.' || 'It is not code-signed yet, so macOS refuses to open it the first time: press Done, open System Settings, then Privacy & Security, and press Open Anyway beside Alexia. Each update asks for Accessibility again.' }}

            Either way the downloads are checked: Alexia verifies its own signature over an update before installing it.

            Alexia installed from an earlier release updates itself to this one: it offers the
            update at startup and replaces itself in place when you press the button.

            The plugin contract is unstable and will break between releases.
